<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>极简俄罗斯方块</title>
    <style>
        body {
            background: #202028;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            border: 4px solid #fff;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        canvas {
            display: block;
            background-color: #000;
        }

        .ui {
            position: absolute;
            top: 0;
            right: -150px;
            text-align: left;
            width: 140px;
        }

        h1 { margin: 0 0 20px 0; }
        .score-label { font-size: 20px; }
        #score { font-size: 32px; color: #ffeb3b; }

        .status-label { margin-top: 18px; font-size: 14px; color: #888; }
        #status { font-size: 16px; color: #0dc2ff; }

        .toolbar {
            display: flex;
            gap: 10px;
            margin-top: 18px;
        }

        .toolbar button {
            padding: 8px 22px;
            font-size: 15px;
            font-family: inherit;
            border: 2px solid #fff;
            border-radius: 6px;
            background: transparent;
            color: #fff;
            cursor: pointer;
            transition: background-color .2s ease, color .2s ease, opacity .2s ease;
        }

        .toolbar button:hover:not(:disabled) {
            background: #fff;
            color: #202028;
        }

        .toolbar button:disabled {
            opacity: .3;
            cursor: not-allowed;
        }

        #btn-start { border-color: #0dff72; color: #0dff72; }
        #btn-start:hover:not(:disabled) { background: #0dff72; color: #202028; }

        #btn-pause { border-color: #ffe135; color: #ffe135; }
        #btn-pause:hover:not(:disabled) { background: #ffe135; color: #202028; }

        #btn-close { border-color: #ff0d72; color: #ff0d72; }
        #btn-close:hover:not(:disabled) { background: #ff0d72; color: #fff; }

        .overlay {
            position: absolute;
            inset: 0;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 24px;
            box-sizing: border-box;
            background: rgba(0, 0, 0, .78);
            text-align: center;
            transition: opacity .2s ease;
        }

        .overlay.hidden { display: none; }

        #overlay-title {
            font-size: 26px;
            font-weight: bold;
            color: #ffe135;
            text-shadow: 0 0 12px rgba(255, 225, 53, .6);
        }

        #overlay-sub {
            font-size: 13px;
            color: #bbb;
            line-height: 1.7;
        }

        .controls {
            margin-top: 16px;
            font-size: 14px;
            color: #aaa;
            text-align: center;
            line-height: 1.8;
        }
    </style>
</head>
<body>

    <h1>俄罗斯方块</h1>

    <div id="game-container">
        <canvas id="tetris" width="240" height="400"></canvas>
        <div class="ui">
            <div class="score-label">得分:</div>
            <div id="score">0</div>
            <div class="status-label">状态:</div>
            <div id="status">准备开始</div>
        </div>
        <div id="overlay" class="overlay">
            <div id="overlay-title">俄罗斯方块</div>
            <div id="overlay-sub">点击「开始游戏」或按 Enter 开始</div>
        </div>
    </div>

    <div class="toolbar">
        <button type="button" id="btn-start">开始游戏</button>
        <button type="button" id="btn-pause" disabled>暂停</button>
        <button type="button" id="btn-close" disabled>关闭</button>
    </div>

    <div class="controls">
        方向键 ← ↓ → 移动 / 下落，↑ 或 W 旋转，Q 反向旋转<br>
        空格 暂停 / 继续　Enter 开始游戏　P 暂停
    </div>

    <script>
        const canvas = document.getElementById('tetris');
        const context = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const statusElement = document.getElementById('status');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlaySub = document.getElementById('overlay-sub');
        const btnStart = document.getElementById('btn-start');
        const btnPause = document.getElementById('btn-pause');
        const btnClose = document.getElementById('btn-close');

        const COLS = 12;
        const ROWS = 20;

        // 设置比例：每个方块 20px
        context.scale(20, 20);

        // 游戏状态
        const STATE = {
            IDLE: 'idle',
            RUNNING: 'running',
            PAUSED: 'paused',
            OVER: 'over',
            CLOSED: 'closed'
        };
        let state = STATE.IDLE;
        let rafId = null;

        // 消除行逻辑
        function arenaSweep() {
            let rowCount = 1;
            outer: for (let y = arena.length - 1; y > 0; --y) {
                for (let x = 0; x < arena[y].length; ++x) {
                    if (arena[y][x] === 0) {
                        continue outer;
                    }
                }
                // 如果循环到这里，说明这一行全满
                const row = arena.splice(y, 1)[0].fill(0);
                arena.unshift(row);
                ++y;

                score += rowCount * 10;
                rowCount *= 2;
            }
            updateScore();
        }

        // 碰撞检测
        function collide(arena, player) {
            const [m, o] = [player.matrix, player.pos];
            for (let y = 0; y < m.length; ++y) {
                for (let x = 0; x < m[y].length; ++x) {
                    if (m[y][x] !== 0 &&
                       (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
                        return true;
                    }
                }
            }
            return false;
        }

        // 创建游戏网格（二维数组）
        function createMatrix(w, h) {
            const matrix = [];
            while (h--) {
                matrix.push(new Array(w).fill(0));
            }
            return matrix;
        }

        // 定义各种形状的方块
        function createPiece(type) {
            if (type === 'I') {
                return [
                    [0, 1, 0, 0],
                    [0, 1, 0, 0],
                    [0, 1, 0, 0],
                    [0, 1, 0, 0],
                ];
            } else if (type === 'L') {
                return [
                    [0, 2, 0],
                    [0, 2, 0],
                    [0, 2, 2],
                ];
            } else if (type === 'J') {
                return [
                    [0, 3, 0],
                    [0, 3, 0],
                    [3, 3, 0],
                ];
            } else if (type === 'O') {
                return [
                    [4, 4],
                    [4, 4],
                ];
            } else if (type === 'Z') {
                return [
                    [5, 5, 0],
                    [0, 5, 5],
                    [0, 0, 0],
                ];
            } else if (type === 'S') {
                return [
                    [0, 6, 6],
                    [6, 6, 0],
                    [0, 0, 0],
                ];
            } else if (type === 'T') {
                return [
                    [0, 7, 0],
                    [7, 7, 7],
                    [0, 0, 0],
                ];
            }
        }

        // 绘制函数
        function draw() {
            // 清空画布（坐标已按比例缩放）
            context.fillStyle = '#000';
            context.fillRect(0, 0, COLS, ROWS);

            drawMatrix(arena, {x: 0, y: 0});
            if (player.matrix) {
                drawMatrix(player.matrix, player.pos);
            }
        }

        // 绘制矩阵（方块）
        function drawMatrix(matrix, offset) {
            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        // 根据不同数字分配颜色
                        const colors = [null, '#FF0D72', '#0DC2FF', '#0DFF72', '#F538FF', '#FF8E0D', '#FFE135', '#3877FF'];
                        context.fillStyle = colors[value];
                        context.fillRect(x + offset.x, y + offset.y, 1, 1);

                        // 给方块加个细边框，看起来更精致点
                        context.lineWidth = 0.05;
                        context.strokeStyle = 'white';
                        context.strokeRect(x + offset.x, y + offset.y, 1, 1);
                    }
                });
            });
        }

        // 将玩家方块合并到网格中
        function merge(arena, player) {
            player.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        arena[y + player.pos.y][x + player.pos.x] = value;
                    }
                });
            });
        }

        // 方块旋转逻辑
        function rotate(matrix, dir) {
            for (let y = 0; y < matrix.length; ++y) {
                for (let x = 0; x < y; ++x) {
                    [
                        matrix[x][y],
                        matrix[y][x],
                    ] = [
                        matrix[y][x],
                        matrix[x][y],
                    ];
                }
            }
            if (dir > 0) {
                matrix.forEach(row => row.reverse());
            } else {
                matrix.reverse();
            }
        }

        // 下落逻辑
        function playerDrop() {
            if (state !== STATE.RUNNING) return;

            player.pos.y++;
            if (collide(arena, player)) {
                player.pos.y--;
                merge(arena, player);
                if (playerReset()) {
                    arenaSweep();
                }
                updateScore();
            }
            dropCounter = 0;
        }

        // 水平移动逻辑
        function playerMove(dir) {
            if (state !== STATE.RUNNING) return;
            player.pos.x += dir;
            if (collide(arena, player)) {
                player.pos.x -= dir;
            }
        }

        // 重置/生成新方块；返回 false 表示新方块无处可放（游戏结束）
        function playerReset() {
            const pieces = 'TJLOSIZ';
            player.matrix = createPiece(pieces[pieces.length * Math.random() | 0]);
            player.pos.y = 0;
            player.pos.x = (arena[0].length / 2 | 0) -
                           (player.matrix[0].length / 2 | 0);

            // 如果一生成就碰撞，说明游戏结束
            if (collide(arena, player)) {
                player.matrix = null;
                gameOver();
                return false;
            }
            return true;
        }

        // 处理旋转并处理墙壁碰撞
        function playerRotate(dir) {
            if (state !== STATE.RUNNING) return;

            const pos = player.pos.x;
            let offset = 1;
            rotate(player.matrix, dir);
            while (collide(arena, player)) {
                player.pos.x += offset;
                offset = -(offset + (offset > 0 ? 1 : -1));
                if (offset > player.matrix[0].length) {
                    rotate(player.matrix, -dir);
                    player.pos.x = pos;
                    return;
                }
            }
        }

        let dropCounter = 0;
        let dropInterval = 1000; // 每秒下落一次（1000毫秒）
        let lastTime = 0;

        // 主循环：只在 RUNNING 状态下计时与绘制
        function update(time = 0) {
            if (state !== STATE.RUNNING) {
                rafId = null;
                return;
            }

            const deltaTime = time - lastTime;
            lastTime = time;

            dropCounter += deltaTime;
            if (dropCounter > dropInterval) {
                playerDrop();
            }

            draw();
            rafId = requestAnimationFrame(update);
        }

        function startLoop() {
            if (rafId !== null) return;
            lastTime = performance.now();
            dropCounter = 0;
            rafId = requestAnimationFrame(update);
        }

        function stopLoop() {
            if (rafId !== null) {
                cancelAnimationFrame(rafId);
                rafId = null;
            }
        }

        function updateScore() {
            scoreElement.innerText = score;
        }

        // 根据状态刷新按钮可用性与提示浮层
        function updateUI() {
            statusElement.innerText = {
                [STATE.IDLE]: '准备开始',
                [STATE.RUNNING]: '进行中',
                [STATE.PAUSED]: '已暂停',
                [STATE.OVER]: '游戏结束',
                [STATE.CLOSED]: '已关闭'
            }[state];

            btnStart.disabled = state === STATE.RUNNING || state === STATE.PAUSED;
            btnPause.disabled = state !== STATE.RUNNING && state !== STATE.PAUSED;
            btnClose.disabled = state === STATE.IDLE || state === STATE.CLOSED;
            btnPause.innerText = state === STATE.PAUSED ? '继续' : '暂停';

            if (state === STATE.RUNNING) {
                overlay.classList.add('hidden');
                return;
            }

            overlay.classList.remove('hidden');
            if (state === STATE.IDLE) {
                overlayTitle.innerText = '俄罗斯方块';
                overlaySub.innerText = '点击「开始游戏」或按 Enter 开始';
            } else if (state === STATE.PAUSED) {
                overlayTitle.innerText = '已暂停';
                overlaySub.innerText = '按空格或点击「继续」恢复游戏';
            } else if (state === STATE.OVER) {
                overlayTitle.innerText = '游戏结束';
                overlaySub.innerText = `本局得分 ${score}　点击「开始游戏」再来一局`;
            } else {
                overlayTitle.innerText = '游戏已关闭';
                overlaySub.innerText = '点击「开始游戏」重新开始';
            }
        }

        function setState(next) {
            state = next;
            if (next === STATE.RUNNING) {
                startLoop();
            } else {
                stopLoop();
            }
            updateUI();
        }

        // 开始新的一局
        function startGame() {
            arena.forEach(row => row.fill(0));
            score = 0;
            player.pos = {x: 0, y: 0};
            player.matrix = null;
            updateScore();
            playerReset();
            setState(STATE.RUNNING);
            draw();
        }

        // 暂停 / 继续
        function togglePause() {
            if (state === STATE.RUNNING) {
                setState(STATE.PAUSED);
            } else if (state === STATE.PAUSED) {
                setState(STATE.RUNNING);
            }
        }

        // 关闭本局（不刷新页面，可随时重新开始）
        function closeGame() {
            if (state === STATE.IDLE || state === STATE.CLOSED) return;
            setState(STATE.CLOSED);
        }

        // 游戏结束：保留最终棋盘，停止计时
        function gameOver() {
            setState(STATE.OVER);
            draw();
        }

        // 初始化变量
        const arena = createMatrix(COLS, ROWS);
        let score = 0;

        const player = {
            pos: {x: 0, y: 0},
            matrix: null,
        };

        // 按钮事件
        btnStart.addEventListener('click', startGame);
        btnPause.addEventListener('click', togglePause);
        btnClose.addEventListener('click', closeGame);

        // 键盘监听
        document.addEventListener('keydown', event => {
            const key = event.key;

            // 空格：暂停 / 继续
            if (key === ' ' || event.code === 'Space') {
                event.preventDefault();
                if (state === STATE.RUNNING || state === STATE.PAUSED) {
                    togglePause();
                }
                return;
            }

            // Enter：开始新游戏（暂停中不触发，避免误丢进度）
            if (key === 'Enter') {
                if (state === STATE.IDLE || state === STATE.OVER || state === STATE.CLOSED) {
                    startGame();
                }
                return;
            }

            if (state !== STATE.RUNNING) return;

            if (event.keyCode === 37) { // 左
                event.preventDefault();
                playerMove(-1);
            } else if (event.keyCode === 39) { // 右
                event.preventDefault();
                playerMove(1);
            } else if (event.keyCode === 40) { // 下
                event.preventDefault();
                playerDrop();
            } else if (event.keyCode === 87 || event.keyCode === 38) { // W 或 上（旋转）
                event.preventDefault();
                playerRotate(1);
            } else if (event.keyCode === 81) { // Q（反向旋转）
                playerRotate(-1);
            } else if (event.keyCode === 80) { // P（暂停）
                togglePause();
            }
        });

        // 启动：初始为待开始状态
        draw();
        updateScore();
        updateUI();
    </script>
</body>
</html>
